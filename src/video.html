  for(let i=0;i<60;i++){const x=110+i*(860/59);let h=i%5===0?56:30;const lit=i<=idx;
    if(lt>=flip)h+=30*Math.max(0,Math.sin(lt*11-i*.35));else if(i===Math.floor(idx))h+=34;

  c.save();c.translate(500,1140);c.rotate((-4+1.3*Math.sin(lt*2.3))*Math.PI/180);const sc=1+.14*kf+.03*pump(lt);c.scale(sc,sc);
