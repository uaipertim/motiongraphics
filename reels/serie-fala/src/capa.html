<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAZLO Hospeda — Série Fala · Capa</title>
<style>
  @font-face { font-family: 'FL Display'; src: url('fonts/InterDisplay-SemiBold.otf') format('opentype'); font-weight: 600; }
  @font-face { font-family: 'FL Display'; src: url('fonts/InterDisplay-Bold.otf') format('opentype'); font-weight: 700; }
  @font-face { font-family: 'FL Display'; src: url('fonts/InterDisplay-ExtraBold.otf') format('opentype'); font-weight: 800; }
  @font-face { font-family: 'FL Display'; src: url('fonts/InterDisplay-Black.otf') format('opentype'); font-weight: 900; }
  @font-face { font-family: 'FL Mono'; src: url('fonts/JetBrainsMonoNL-Medium.ttf') format('truetype'); font-weight: 500; }
  @font-face { font-family: 'FL Mono'; src: url('fonts/JetBrainsMonoNL-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'FL Mono'; src: url('fonts/JetBrainsMonoNL-ExtraBold.ttf') format('truetype'); font-weight: 800; }
  html, body { margin: 0; background: #0A0A0A; }
  canvas { display: block; height: 100vh; aspect-ratio: 9 / 16; margin: 0 auto; }
  body.render canvas { height: auto; width: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="anim.js"></script>
<script src="capa.js"></script>
<script>
  // capa.html?ep=fala-01 — a capa do episódio (o título vem de episodios/<id>.json)
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const params = new URLSearchParams(location.search);
  if (params.has('render')) document.body.classList.add('render');
  const EPID = params.get('ep') || 'fala-01';
  const loadImg = (src) => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
  window.ready = (async () => {
    const fonts = [600, 700, 800, 900].map((w) => document.fonts.load(`${w} 100px 'FL Display'`))
      .concat([500, 700, 800].map((w) => document.fonts.load(`${w} 100px 'FL Mono'`)));
    const [img, ep] = await Promise.all([loadImg('assets/fazlo-hospeda-logo-alpha.png'),
      fetch(`../episodios/${EPID}.json`).then((r) => r.json()), ...fonts]);
    await img.decode(); await document.fonts.ready;
    
    FALACAPA.init(img, ep);
    FALACAPA.render(ctx);
  })();
  window.coverFrame = () => { FALACAPA.render(ctx); return canvas.toDataURL('image/png'); };
  window.coverBoxes = () => FALACAPA.boxes();
</script>
</body>
</html>
